# Alembic configuration.
# `script_location` is the key the CLI complained about when this file did not
# exist yet - it tells alembic where the migration environment lives.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# The database URL is NOT stored here. alembic/env.py reads it from the app
# settings (i.e. from the environment / .env), so there is exactly one source of
# truth and no credentials in a committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
