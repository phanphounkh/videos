[project]
name = "ai-video-studio-backend"
version = "0.1.0"
description = "AI Video Studio - FastAPI backend (API + background workers)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.109",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "bcrypt>=4.2",
    "pydantic[email]>=2",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "pillow>=12.3.0",
    "edge-tts>=7.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

# This is an application, not an installable library, so uv should only
# manage the virtualenv and never try to build a wheel from it.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
