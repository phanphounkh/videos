# =============================================================================
# Sorya - local stack
#
# Host ports are deliberately offset (5435/6381/9100/8011/3355) so this stack
# never collides with other projects already running on this machine.
# INSIDE the compose network, services reach each other by SERVICE NAME on the
# container port: postgres:5432, redis:6379, s3:8333. Never localhost -
# inside a container localhost means that container itself.
# =============================================================================

name: ai-video-studio

services:
  postgres:
    image: postgres:16-alpine
    container_name: avs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_video_studio}
      # UTF-8 everywhere: Khmer text must survive the database round trip.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_video_studio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [avs]

  redis:
    image: redis:7-alpine
    container_name: avs_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [avs]

  # Telemetry has a database of its own, on purpose: events are written constantly and
  # read in bulk by the admin panel, and neither should ever compete with the app's data.
  telemetry-db:
    image: postgres:16-alpine
    container_name: avs_telemetry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TELEMETRY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TELEMETRY_POSTGRES_DB:-telemetry}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${TELEMETRY_DB_HOST_PORT:-5437}:5432"
    volumes:
      - telemetry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TELEMETRY_POSTGRES_USER:-postgres} -d ${TELEMETRY_POSTGRES_DB:-telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [avs]

  # Ingests every event (from the API and worker through a Redis stream, from the browser
  # over HTTP) and serves them to the admin panel.
  telemetry:
    build:
      context: ./telemetry
      dockerfile: Dockerfile
    container_name: avs_telemetry
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${TELEMETRY_POSTGRES_USER:-postgres}:${TELEMETRY_POSTGRES_PASSWORD:-postgres}@telemetry-db:5432/${TELEMETRY_POSTGRES_DB:-telemetry}
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      HOSTNAME: telemetry-ingest-1
      # The shared .env sets API_PREFIX=/api for the backend; telemetry's routes,
      # the healthcheck and the frontend/admin proxies all expect /api/v1.
      API_PREFIX: /api/v1
    ports:
      - "${TELEMETRY_HOST_PORT:-8006}:8000"
    depends_on:
      telemetry-db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [avs]

  # S3-compatible object storage.
  #
  # WHY SeaweedFS and not MinIO: MinIO's container images are no longer publicly
  # pullable (both docker.io/minio/minio and quay.io now require auth). SeaweedFS
  # speaks the same S3 API, so our boto3-based storage layer is unchanged and AWS
  # S3 / R2 / MinIO can be swapped in later purely through S3_* env vars.
  #
  # Anonymous read is enabled in infra/seaweedfs/s3.json so the browser and the
  # Remotion renderer can GET media straight from a URL.
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: avs_s3
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      # -ip is the address SeaweedFS ADVERTISES to peers (must be the service
      # name so other containers can reach it); -ip.bind is what it LISTENS on.
      # Without the 0.0.0.0 bind it refuses connections to localhost, which is
      # exactly what the healthcheck uses.
      - -ip=s3
      - -ip.bind=0.0.0.0
    ports:
      - "${S3_HOST_PORT:-9100}:8333"      # S3 API
      - "${S3_CONSOLE_HOST_PORT:-9101}:8888"  # filer web UI
    volumes:
      - s3_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [avs]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avs_backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Override the host-oriented values from .env with in-network addresses.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_video_studio}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
    ports:
      - "${BACKEND_HOST_PORT:-8011}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      s3: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [avs]

  # Background worker: AI generation jobs + video rendering.
  # It bundles Python (ARQ tasks) AND Node/Remotion/FFmpeg, because a render job
  # is a Python task that shells out to the Remotion CLI.
  renderer-worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    container_name: avs_worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_video_studio}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
      # Media URLs written into the render payload. Headless Chromium runs in
      # THIS container, so they must be in-network, not localhost.
      S3_RENDERER_BASE_URL: http://s3:8333
      RENDERER_DIR: /renderer
      # One Chromium tab per render: each tab costs hundreds of MB, and on a
      # memory-constrained host more tabs means swapping and per-frame timeouts.
      REMOTION_CONCURRENCY: "1"
      REMOTION_FRAME_TIMEOUT_MS: "120000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      s3: {condition: service_healthy}
    # Chromium (used by Remotion) needs more than the default 64MB of shared memory.
    shm_size: "1gb"
    networks: [avs]

  frontend:
    build:
      # Repo root: the editor preview shares the renderer's composition.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked at build time; the SSR server proxies /api to the backend.
        BACKEND_URL: http://backend:8000
    container_name: avs_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      TELEMETRY_URL: http://telemetry:8000
      # adapter-node assumes https without a proxy header, so SvelteKit's origin check
      # rejected every multipart upload (403) from a plain-http browser. Set this to the
      # address people open the app at.
      ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3355}
      # adapter-node cuts request bodies at 512K by default, which broke every video
      # upload through the /api proxy. The backend enforces the real cap (MAX_UPLOAD_SIZE_MB).
      BODY_SIZE_LIMIT: Infinity
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "${FRONTEND_HOST_PORT:-3355}:3000"
    depends_on:
      backend: {condition: service_started}
    networks: [avs]

  # The admin panel: a separate app from the frontend. Administrators sign in with a normal
  # account that has admin rights; it manages people and reads every telemetry event.
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: avs_admin
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      TELEMETRY_URL: http://telemetry:8000
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "${ADMIN_HOST_PORT:-5175}:3000"
    depends_on:
      backend: {condition: service_started}
      telemetry: {condition: service_started}
    networks: [avs]

volumes:
  postgres_data:
  redis_data:
  s3_data:
  telemetry_db_data:

networks:
  avs:
    name: ai_video_studio_net
    driver: bridge
