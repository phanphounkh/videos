[project]
name = "sorya-studio-telemetry"
version = "0.1.0"
description = "Event telemetry service: ingests every backend, worker and browser event, and serves them to the admin panel"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "user-agents>=2.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "B006"]  # FastAPI declares list query parameters with a [] default

[tool.ruff.lint.per-file-ignores]
# Long literal rows and URLs read better unbroken in tests.
"tests/*" = ["E501", "UP031"]
